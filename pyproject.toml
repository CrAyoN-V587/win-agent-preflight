[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "win-agent-preflight"
version = "0.1.0"
description = "Windows-first preflight diagnostics for AI coding agents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "CrAyoN-V587" }]
dependencies = [
    "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[project.scripts]
agent-preflight = "win_agent_preflight.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
